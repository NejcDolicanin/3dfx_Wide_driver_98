; wideDriver.ini -- goes next to Turok.exe
;
; The screen resolution is NOT set here.  It comes from the wide driver's
; "Glide Override Resolution" setting.
;

[TUROK]

; --- aspect ratio -----------------------------------------------------------
; 1 = fix the projection aspect ratio as well as the screen size (default).
;     Hor+ widescreen: vertical field of view unchanged, more visible to the
;     sides.
; 0 = screen size only.  The picture fills the screen but keeps the 4:3
;     projection, so it is horizontally stretched.  A diagnostic, not a
;     preference -- it separates "fills the screen" from "geometry is right".
aspect_fix=1

; --- field of view ----------------------------------------------------------
; Percentage of the game's own field of view, in degrees.  100 = untouched.
; This scales guPerspective's half-angle, so it widens the view vertically and
; horizontally in the same proportion -- nothing is distorted at any setting.
; It is independent of aspect_fix, which handles the widescreen part.
;
; Useful range is roughly 90..140.  Clamped to 50..200.
;
; Caveat: the game's own visibility culling still uses its unscaled FOV, so at
; large values scenery may vanish slightly before it leaves the screen.  If you
; see things popping in and out near the edges, bring this back towards 100.
; on 21:9 110/116
fov=110
