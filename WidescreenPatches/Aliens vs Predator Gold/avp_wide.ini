[AvP]

; ---------------------------------------------------------------------------
; HUD SIZE
;
; Each HUD scales with screen HEIGHT, which is identical in every 4:3 mode the
; game shipped with and keeps the HUD in proportion to the view on a widescreen.
; The original scaled with WIDTH, which gave 3.06x at 1960 wide where the
; picture itself only grew 1.75x - about twice the size it should have been.
;
; These are percentages on top of that. 100 = in proportion to the view.
; Range 25..400. Every one of them defaults to 100, so this whole file can be
; deleted and the game will behave exactly as if it were all set to 100.
; ---------------------------------------------------------------------------

; Marine health, armour and ammo readouts.
marineHud=100

; Marine motion tracker.
marineRadar=100

; Predator health and energy columns.
predatorHud=100

; Alien health bar - the bar across the bottom of the screen. Its length shows
; health and its thickness follows the length, so this scales the whole bar and
; the taper is kept.
alienHud=100
