; wideDriver.ini -- goes next to MDK3DFX.EXE
;
; The screen resolution is NOT set here.  It comes from the wide driver's
; "Glide Override Resolution" setting, which is the single source of truth.
;
; Two keys left, and both are genuine preferences.  Everything else that used
; to be here was scaffolding -- the patch bitmask, the linear-LFB switch, the
; F12 suppressor and the sky/HUD test flags -- and all of it is now either
; confirmed and unconditional or deleted outright.  The file is optional; the
; defaults below are what you get without it.

[MDK]

; K20 / K24 / K36.  The backdrops -- the menu and intro starfield, the terrain
; under the intro dive, and the outro's star field.  MDK renders all of them
; at 600x360; these scale them up.
;
;   1  stretch to fill the screen                              (default)
;   2  keep the original 600x360 shape, centred, with bars
;   0  off: 1:1 and centred, as before any of this
;
; Neither shows more of the WORLD than the game drew -- it renders 600x360
; either way.  The choice is whether the error goes into the shape (1) or
; into the framing (2).  At 1920x800 mode 2 draws 1333x800 with 293 px of
; bar on each side; at 1600x1200 it would be bars top and bottom instead.
;
; 2 is what this install has been tested on and what the HUD anchoring is
; measured against, so leave it unless you want the stretch.
backdrop=2