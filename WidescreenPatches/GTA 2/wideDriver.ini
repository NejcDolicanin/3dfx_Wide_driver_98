; Glide wide-resolution driver -- GTA2 settings.
;
; Copy this next to gta2.exe.  Keys must stay under [GTA2].
;
; Only genuine preferences live here.  The UI placement fixes (HUD anchoring,
; message text, wanted-level icons, score popup) are applied unconditionally --
; each is a correctness fix with no setting in which leaving it wrong is useful.
;
; THE RESOLUTION IS NOT SET HERE.  It comes from the wide driver's own
; "Glide Override Resolution" setting (FX_GLIDE_OVERRIDE_RESOLUTION), read
; through glide3x's own registry/environment lookup
;
; With that override Disabled, nothing here is patched at all and GTA2 runs
; exactly as it would without this DLL.

[GTA2]

; --- aspect_fix : camera and sprite scaling -------------------------------
;
; Hooks the camera update and adjusts the camera's own zoom field once, so map
; geometry AND sprites scale together on a non-4:3 screen.  Without it the
; world and the sprites disagree.
;
;   1 = on (default)
;   0 = off

aspect_fix=1


; --- extra_zoom : pull the camera further out -----------------------------
;
; Hundredths of a zoom step, applied on top of aspect_fix.
;
;     0  the framing aspect_fix gives (default)
;   100  one step out
;   200  two steps out
;
; Negative values pull the camera in.

extra_zoom=0


; --- virtual_height : HUD and UI size -------------------------------------
;
; The viewport scale is (screen_height << 14) / virtual_height, and this is the
; divisor.  It is HUD/UI size only -- the camera is not affected.
;
;    480  original proportions (default)
;    720  two-thirds size
;   1080  1:1 pixels, smallest
;
; Clamped to 120..8192, so a typo here cannot cause a divide-by-zero inside the
; game's own code.

virtual_height=480
